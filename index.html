<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
</head>
<body>
    <main class="page">
        <div class="wrapper">
            <div class="container-title">
                <h1>Выбери свой продукт</h1>
            </div>
            <div class="card-container">
                <img src="images/product-moisturizing-mousse.png" alt="Увлажняющий мусс">
                <span class="product-category">Для нормальной кожи</span>
                <h2 class="product-name">Увлажняющий мусс</h2>
                <p class="product-description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.</p>
                <span>Состав:</span>
                <ul class="product-compound">
                    <li class="product-compound-item">активные натуральные комплексы</li>
                    <li class="product-compound-item">витамины С, А, РР, В И Е</li>
                    <li class="product-compound-item">солнцезащитные</li>
                </ul>
                <div class="product-price-container">
                    <span class="product-price-label">Цена</span>
                    <span class="product-price">2750 &#8381</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
